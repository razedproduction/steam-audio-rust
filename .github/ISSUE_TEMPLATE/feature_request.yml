name: Feature request
description: Propose a module, API, or improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: input
    id: upstream
    attributes:
      label: Corresponding upstream feature
      description: Link to the matching part of Steam Audio, if any.
